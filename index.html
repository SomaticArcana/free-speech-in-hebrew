<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f1fb">
<title>Free Speech in Hebrew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,500..700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* Layout idea: a night-flight instrument panel. Deep indigo hero with gold Hebrew as the one bold element; cool sky-paper ground with a faint chart grid; floating tab bar; motion on every answer. */
:root{
  --paper:#e8edf7; --card:#ffffff; --ink:#101a3c; --soft:#525d7d; --line:#d0d8ea; --accent:#8f5400; --accent-soft:#fdefd3; --blue:#2b3a9e; --blue-soft:#e4e8fb; --gold:#f0ac2e; --night1:#0b1437; --night2:#27308a; --teal:#0c7f79; --grid:rgba(43,58,158,.055); --shadow:16,26,60;
  --good:#1f7a4d; --warn:#a2660a; --bad:#b03a3a;
  --disp:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif; --heb:"Frank Ruhl Libre","Noto Serif Hebrew","Times New Roman",serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#080d21; --card:#111a3a; --ink:#e9edfb; --soft:#a6b1d3; --line:#27325e; --accent:#f5b94a; --accent-soft:#3b2d10; --blue:#a9b8ff; --blue-soft:#1b2658; --gold:#f5b94a; --night1:#050a1f; --night2:#27308a; --teal:#4fd1c7; --grid:rgba(169,184,255,.05); --shadow:0,0,0;
  --good:#5cc793; --warn:#e3b05a; --bad:#ef8a8a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#080d21; --card:#111a3a; --ink:#e9edfb; --soft:#a6b1d3; --line:#27325e; --accent:#f5b94a; --accent-soft:#3b2d10; --blue:#a9b8ff; --blue-soft:#1b2658; --gold:#f5b94a; --night1:#050a1f; --night2:#27308a; --teal:#4fd1c7; --grid:rgba(169,184,255,.05); --shadow:0,0,0;
  --good:#5cc793; --warn:#e3b05a; --bad:#ef8a8a; color-scheme:dark;}
@font-face{font-family:"Paleo";src:url("fonts/phoenician.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body{padding-bottom:84px}
main{max-width:680px;margin:0 auto;padding:16px 16px 24px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.45rem;font-weight:600} h2{font-size:1.15rem;font-weight:600;margin-top:4px} h3{font-size:1rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.soft{color:var(--soft)} .small{font-size:.86rem}
.heb{font-family:var(--heb);direction:rtl;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 13px;min-height:42px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#08131c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#08131c}}
.btn.amber{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn:focus-visible,.tab:focus-visible,.cell:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.play{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--blue);background:var(--blue-soft);border-radius:999px;padding:6px 12px 6px 8px;min-height:40px}
.play svg{width:22px;height:22px;flex:none}
.play.playing{background:var(--accent-soft);border-color:var(--accent)}
.play .w{font-family:var(--heb);font-size:1.25rem;direction:rtl}
.badge{font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;padding:2px 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;align-self:flex-start;margin-top:3px}
.b-DOC,.b-TEXT{color:var(--good)} .b-DEB{color:var(--warn)} .b-TRAD{color:var(--blue)} .b-CHR{color:var(--accent)} .b-POP{color:var(--bad)}
.note{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0);z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:680px}
.tab{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--soft);border-top:3px solid transparent}
.tab .g{font-family:var(--heb);font-size:1.3rem;line-height:1}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:rtl}
.cell{direction:ltr;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
.cell .g{font-family:var(--heb);font-size:2.1rem;line-height:1.15}
.cell .n{font-size:.72rem;color:var(--soft)}
.cell.done{border-color:var(--good)} .cell.done::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--good)}
.cell.m{box-shadow:inset 0 -3px 0 var(--accent)} .cell.d{box-shadow:inset 0 -3px 0 var(--blue)}
.big{font-family:var(--heb);font-size:6rem;line-height:1;direction:rtl}
.evo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.evo div{border:1px solid var(--line);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:86px;justify-content:space-between;animation:rise .5s both}
.evo div:nth-child(2){animation-delay:.12s}.evo div:nth-child(3){animation-delay:.24s}.evo div:nth-child(4){animation-delay:.36s}.evo div:nth-child(5){animation-delay:.48s}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}

.evo .s{font-size:1.9rem;line-height:1.2;height:44px;display:flex;align-items:center}
.evo .paleo{font-family:"Paleo",var(--heb)} .evo svg{width:40px;height:40px}
.evo .c{font-family:var(--mono);font-size:.6rem;color:var(--soft);text-align:center;line-height:1.2}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;white-space:nowrap;min-height:38px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
canvas.trace{width:100%;max-width:260px;aspect-ratio:1;border:1px dashed var(--line);border-radius:10px;touch-action:none;background:var(--paper);align-self:center}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:500}
.scroll{overflow-x:auto}
.stage{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.stage div{height:34px;border-radius:5px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.68rem;color:var(--soft)}
.stage div.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:500}
.stage div.past{background:var(--blue-soft);border-color:var(--blue)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:22px;height:22px;accent-color:var(--good)}
.task .t{font-family:var(--mono);font-size:.75rem;color:var(--soft)}
.fc{min-height:230px;align-items:center;justify-content:center;text-align:center}
.fc .w{font-family:var(--heb);font-size:3.2rem;line-height:1.3;direction:rtl}
.tr{font-family:var(--mono);font-size:.95rem}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;direction:rtl}
.kb button{font-family:var(--heb);font-size:1.3rem;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 0;min-height:40px}
.out{font-family:var(--heb);font-size:2rem;direction:rtl;min-height:48px;border-bottom:2px solid var(--line);text-align:center}
.wl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.line{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;min-height:52px;border:1px dashed var(--line);border-radius:10px;padding:8px;align-items:center}
.line .chip{direction:rtl;font-family:var(--heb);font-size:1.25rem}
a{color:var(--blue)}
dialog{border:0;padding:0;width:100%;max-width:680px;max-height:100%;height:100%;background:var(--paper);color:var(--ink);margin:0 auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sheet{padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
.bar{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);z-index:2}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--good)}
.root-map{display:flex;flex-direction:column;gap:8px}
.root-head{display:flex;align-items:baseline;gap:12px;justify-content:space-between}
.root-head .r{font-family:var(--heb);font-size:2rem;direction:rtl;letter-spacing:.05em;color:var(--accent)}
textarea{width:100%;min-height:70px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.hl{color:var(--accent);font-weight:700}

/* accessibility pass (rev 8) */
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
html[data-motion="off"] *,html[data-motion="off"] *::before,html[data-motion="off"] *::after{animation:none!important;transition:none!important}
html[data-motion="off"] .meter i.run{animation:drain 4s steps(4,end) forwards!important}

.pic{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--ink);flex:none;font-family:var(--heb);font-weight:700;font-size:1.15rem;line-height:1}
.pic svg{width:70%;height:70%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pic.lg{width:120px;height:120px;border-radius:20px;font-size:3rem}
.pic.md{width:64px;height:64px;font-size:1.6rem}
.pic.sm{width:30px;height:30px;border-radius:7px;font-size:.8rem}
.wl{grid-template-columns:auto auto 1fr}
.lcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-decoration:none;color:inherit}
.num{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:500}
.num.done{background:var(--good);border-color:var(--good);color:#fff}
.num.next{border-color:var(--accent);background:var(--accent-soft)}
.pics{display:flex;gap:4px;flex-wrap:wrap}
.step{border-left:4px solid var(--blue);padding-left:12px}
.step.ok{border-left-color:var(--good)}
.steph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hook{background:var(--blue-soft);border-radius:8px;padding:8px 10px;font-size:.92rem}
.wcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wcard:first-of-type{border-top:0}
.slots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.slot{border:2px dashed var(--accent);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:.8rem;background:var(--accent-soft)}
.arrow{color:var(--soft);font-family:var(--mono)}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left}
.timer{font-family:var(--mono);font-size:2.4rem;text-align:center}
.verse{direction:rtl;display:flex;flex-wrap:wrap;gap:6px 8px;padding:10px 0;border-top:1px solid var(--line)}
.verse:first-of-type{border-top:0}
.tok{font-family:var(--heb);font-size:1.55rem;line-height:1.5;border:0;background:none;padding:0 3px;border-radius:6px;color:var(--soft)}
.tok.k{color:var(--ink);border-bottom:2px dotted var(--accent)}
.tok.hit{background:var(--accent-soft);color:var(--ink)}
.tok small{display:block;font-family:var(--body);font-size:.62rem;direction:ltr;text-align:center;color:var(--soft);line-height:1.1}
.dia{width:100%;height:auto;display:block}
.dia text{font-family:"IBM Plex Mono",monospace;fill:currentColor}
.rootsvg text{font-family:"IBM Plex Mono",monospace;fill:currentColor;font-size:9px}
.rootsvg .rt{font-family:"Frank Ruhl Libre",serif;font-size:20px;fill:var(--accent);font-weight:700}
.rootsvg g.n{cursor:pointer}
.meter i.run{background:var(--accent);width:100%;animation:drain 4s linear forwards}
@keyframes drain{from{width:100%}to{width:0}}
.unit{border-left:4px solid var(--accent);padding:2px 0 2px 12px}
.btn:disabled{opacity:.45}
.loadbar{position:fixed;left:0;right:0;top:0;z-index:50;border:0;padding:6px 12px 8px;background:var(--card);color:var(--soft);font:500 .75rem var(--mono);text-align:left;border-bottom:1px solid var(--line)}
.loadbar i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .2s}
.loadbar[hidden]{display:none}
details.unitdone>summary{cursor:pointer;padding:8px 0}
.fcell{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-decoration:none;color:inherit}
a.fcell .heb{font-size:1.25rem;border-bottom:1px dashed var(--accent)}
.ftbl td{vertical-align:top;min-width:86px}
label.row{display:flex;gap:10px;align-items:center;text-align:left}
label.row input{flex:0 0 auto;width:22px;height:22px}

/* ===== rev 10 skin ===== */
html,body{background:var(--paper)}
body{padding-bottom:108px;background-image:radial-gradient(90% 40% at 100% 0%,color-mix(in srgb,var(--gold) 10%,transparent),transparent 70%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,24px 24px,24px 24px;background-attachment:fixed,scroll,scroll}
h1{font-family:var(--disp);font-size:2.05rem;font-weight:700;letter-spacing:.005em;line-height:1.05}
h2{font-family:var(--disp);font-size:1.5rem;font-weight:600;line-height:1.1}
h3{font-size:1.03rem}
.eyebrow{color:var(--accent);letter-spacing:.14em;font-weight:500}
.stack{gap:14px}
.card{border-radius:18px;padding:16px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 26px -14px rgba(var(--shadow),.35);transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.btn{border-radius:12px;font-weight:500;transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .15s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.btn:active,.chip:active,.play:active,.tab:active,.cell:active{transform:scale(.95)}
.btn.primary,:root[data-theme="dark"] .btn.primary{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--p1),var(--p2));border-color:transparent;color:#fff;box-shadow:0 10px 20px -10px color-mix(in srgb,var(--p2) 90%,transparent),inset 0 1px 0 rgba(255,255,255,.28);font-weight:600;letter-spacing:.01em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#fff}}
.btn.primary::after,.btn.gold::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);animation:shine 4.5s ease-in-out infinite}
.btn.primary:disabled::after{display:none}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.btn.gold,.btn.amber{position:relative;overflow:hidden;color:var(--onGold)!important;background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 55%,#fff),var(--gold) 55%,color-mix(in srgb,var(--gold) 82%,#000));border-color:transparent;color:var(--onGold);font-weight:600;box-shadow:0 10px 22px -10px color-mix(in srgb,var(--gold) 90%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.gold{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;font-size:1.05rem;text-decoration:none;border-radius:16px}
.btn.gold b{font-family:var(--disp);font-size:1.35rem;font-weight:700;letter-spacing:.02em}
.chip{transition:transform .12s,background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--p1),var(--p2));border-color:transparent;color:#fff}
.play{background:linear-gradient(135deg,var(--blue-soft),var(--card));border-color:color-mix(in srgb,var(--blue) 55%,transparent);box-shadow:0 4px 10px -6px rgba(var(--shadow),.5);transition:transform .12s,background .2s,border-color .2s}
.play svg{color:var(--blue)}
.play.playing{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 40%,#fff),var(--accent-soft));border-color:var(--gold);animation:ring 1s ease-out infinite}
.play.playing svg{color:var(--accent);animation:beat .5s ease-in-out infinite alternate}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 55%,transparent)}100%{box-shadow:0 0 0 12px color-mix(in srgb,var(--gold) 0%,transparent)}}
@keyframes beat{from{transform:scale(1)}to{transform:scale(1.18)}}
.pic{background:linear-gradient(145deg,color-mix(in srgb,var(--accent-soft) 45%,#fff),var(--accent-soft));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 8px -5px rgba(var(--shadow),.5);border-radius:12px}
:root[data-theme="dark"] .pic{background:linear-gradient(145deg,#4a3915,var(--accent-soft))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pic{background:linear-gradient(145deg,#4a3915,var(--accent-soft))}}
.pic.lg{width:136px;height:136px;border-radius:30px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 18px 30px -16px color-mix(in srgb,var(--gold) 75%,transparent);animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lcard{border-radius:18px;position:relative;overflow:hidden}
.lcard:active{transform:scale(.98)}
.num{width:46px;height:46px;font-family:var(--disp);font-size:1.3rem;font-weight:700;border:2px solid var(--line);background:var(--card)}
.num.done{background:linear-gradient(135deg,#37b37e,var(--good));border-color:transparent;box-shadow:0 6px 12px -6px rgba(31,122,77,.8)}
.num.next{border-color:var(--gold);background:linear-gradient(135deg,color-mix(in srgb,var(--accent-soft) 50%,#fff),var(--accent-soft));color:var(--onGold);animation:beacon 1.8s ease-out infinite}
@keyframes beacon{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 60%,transparent)}100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--gold) 0%,transparent)}}
.unit{border-left:5px solid var(--gold);border-radius:14px;padding:12px 14px;background:linear-gradient(90deg,var(--blue-soft),transparent 85%);margin-top:6px}
.unit h2{font-size:1.65rem}
.step{border-left:0;padding-left:20px;position:relative;overflow:hidden}
.step::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--p1),var(--teal))}
.step.ok::before{background:linear-gradient(180deg,#37b37e,var(--good))}
.steph h3{font-family:var(--disp);font-size:1.4rem;font-weight:600}
.hook{background:var(--blue-soft);border-radius:4px 14px 14px 14px;border-left:3px solid var(--blue);padding:9px 12px}
.slot{border-color:var(--gold);border-radius:10px;background:var(--accent-soft)}
.fc{min-height:300px;border-radius:26px;padding:22px 18px;gap:12px;background:radial-gradient(120% 70% at 50% 0%,var(--accent-soft),var(--card) 62%);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 26px 44px -26px rgba(var(--shadow),.6);animation:cardIn .38s cubic-bezier(.2,.9,.2,1) both}
.fc.rev{animation:flip .5s cubic-bezier(.2,.8,.2,1) both}
