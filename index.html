<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f1fb">
<title>Free Speech in Hebrew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,500..700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* Layout idea: a night-flight instrument panel. Deep indigo hero with gold Hebrew as the one bold element; cool sky-paper ground with a faint chart grid; floating tab bar; motion on every answer. */
:root{
  --paper:#e8edf7; --card:#ffffff; --ink:#101a3c; --soft:#525d7d; --line:#d0d8ea; --accent:#8f5400; --accent-soft:#fdefd3; --blue:#2b3a9e; --blue-soft:#e4e8fb; --gold:#f0ac2e; --night1:#0b1437; --night2:#27308a; --teal:#0c7f79; --grid:rgba(43,58,158,.055); --shadow:16,26,60;
  --good:#1f7a4d; --warn:#a2660a; --bad:#b03a3a;
  --disp:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif; --heb:"Frank Ruhl Libre","Noto Serif Hebrew","Times New Roman",serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#080d21; --card:#111a3a; --ink:#e9edfb; --soft:#a6b1d3; --line:#27325e; --accent:#f5b94a; --accent-soft:#3b2d10; --blue:#a9b8ff; --blue-soft:#1b2658; --gold:#f5b94a; --night1:#050a1f; --night2:#27308a; --teal:#4fd1c7; --grid:rgba(169,184,255,.05); --shadow:0,0,0;
  --good:#5cc793; --warn:#e3b05a; --bad:#ef8a8a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#080d21; --card:#111a3a; --ink:#e9edfb; --soft:#a6b1d3; --line:#27325e; --accent:#f5b94a; --accent-soft:#3b2d10; --blue:#a9b8ff; --blue-soft:#1b2658; --gold:#f5b94a; --night1:#050a1f; --night2:#27308a; --teal:#4fd1c7; --grid:rgba(169,184,255,.05); --shadow:0,0,0;
  --good:#5cc793; --warn:#e3b05a; --bad:#ef8a8a; color-scheme:dark;}
@font-face{font-family:"Paleo";src:url("fonts/phoenician.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body{padding-bottom:84px}
main{max-width:680px;margin:0 auto;padding:16px 16px 24px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.45rem;font-weight:600} h2{font-size:1.15rem;font-weight:600;margin-top:4px} h3{font-size:1rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.soft{color:var(--soft)} .small{font-size:.86rem}
.heb{font-family:var(--heb);direction:rtl;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 13px;min-height:42px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#08131c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#08131c}}
.btn.amber{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn:focus-visible,.tab:focus-visible,.cell:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.play{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--blue);background:var(--blue-soft);border-radius:999px;padding:6px 12px 6px 8px;min-height:40px}
.play svg{width:22px;height:22px;flex:none}
.play.playing{background:var(--accent-soft);border-color:var(--accent)}
.play .w{font-family:var(--heb);font-size:1.25rem;direction:rtl}
.badge{font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;padding:2px 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;align-self:flex-start;margin-top:3px}
.b-DOC,.b-TEXT{color:var(--good)} .b-DEB{color:var(--warn)} .b-TRAD{color:var(--blue)} .b-CHR{color:var(--accent)} .b-POP{color:var(--bad)}
.note{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0);z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:680px}
.tab{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--soft);border-top:3px solid transparent}
.tab .g{font-family:var(--heb);font-size:1.3rem;line-height:1}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:rtl}
.cell{direction:ltr;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
.cell .g{font-family:var(--heb);font-size:2.1rem;line-height:1.15}
.cell .n{font-size:.72rem;color:var(--soft)}
.cell.done{border-color:var(--good)} .cell.done::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--good)}
.cell.m{box-shadow:inset 0 -3px 0 var(--accent)} .cell.d{box-shadow:inset 0 -3px 0 var(--blue)}
.big{font-family:var(--heb);font-size:6rem;line-height:1;direction:rtl}
.evo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.evo div{border:1px solid var(--line);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:86px;justify-content:space-between;animation:rise .5s both}
.evo div:nth-child(2){animation-delay:.12s}.evo div:nth-child(3){animation-delay:.24s}.evo div:nth-child(4){animation-delay:.36s}.evo div:nth-child(5){animation-delay:.48s}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}

.evo .s{font-size:1.9rem;line-height:1.2;height:44px;display:flex;align-items:center}
.evo .paleo{font-family:"Paleo",var(--heb)} .evo svg{width:40px;height:40px}
.evo .c{font-family:var(--mono);font-size:.6rem;color:var(--soft);text-align:center;line-height:1.2}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;white-space:nowrap;min-height:38px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
canvas.trace{width:100%;max-width:260px;aspect-ratio:1;border:1px dashed var(--line);border-radius:10px;touch-action:none;background:var(--paper);align-self:center}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:500}
.scroll{overflow-x:auto}
.stage{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.stage div{height:34px;border-radius:5px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.68rem;color:var(--soft)}
.stage div.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:500}
.stage div.past{background:var(--blue-soft);border-color:var(--blue)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:22px;height:22px;accent-color:var(--good)}
.task .t{font-family:var(--mono);font-size:.75rem;color:var(--soft)}
.fc{min-height:230px;align-items:center;justify-content:center;text-align:center}
.fc .w{font-family:var(--heb);font-size:3.2rem;line-height:1.3;direction:rtl}
.tr{font-family:var(--mono);font-size:.95rem}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;direction:rtl}
.kb button{font-family:var(--heb);font-size:1.3rem;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 0;min-height:40px}
.out{font-family:var(--heb);font-size:2rem;direction:rtl;min-height:48px;border-bottom:2px solid var(--line);text-align:center}
.wl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.line{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;min-height:52px;border:1px dashed var(--line);border-radius:10px;padding:8px;align-items:center}
.line .chip{direction:rtl;font-family:var(--heb);font-size:1.25rem}
a{color:var(--blue)}
dialog{border:0;padding:0;width:100%;max-width:680px;max-height:100%;height:100%;background:var(--paper);color:var(--ink);margin:0 auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sheet{padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
.bar{position:sticky;top:0;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);z-index:2}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--good)}
.root-map{display:flex;flex-direction:column;gap:8px}
.root-head{display:flex;align-items:baseline;gap:12px;justify-content:space-between}
.root-head .r{font-family:var(--heb);font-size:2rem;direction:rtl;letter-spacing:.05em;color:var(--accent)}
textarea{width:100%;min-height:70px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.hl{color:var(--accent);font-weight:700}

/* accessibility pass (rev 8) */
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
html[data-motion="off"] *,html[data-motion="off"] *::before,html[data-motion="off"] *::after{animation:none!important;transition:none!important}
html[data-motion="off"] .meter i.run{animation:drain 4s steps(4,end) forwards!important}

/* ---------- night stage: shared by the eight games ---------- */
@font-face{font-family:"FRL";src:url("fonts/frank-500.woff2") format("woff2");font-display:swap;unicode-range:U+0590-05FF,U+FB1D-FB4F}
:root{--sg:#efd08f;--sg-hi:#fff1cf;--sg-deep:#b8893e;--sm:#c9c4ef;--sink:#07071a}
body.staged{overflow:hidden}
.nstage{position:fixed;inset:0;z-index:900;background:#07071a url(media/stage/sky.webp) center/cover no-repeat;color:#e8e4ff;display:flex;flex-direction:column;overflow:hidden;--lvl:0;font-family:var(--body,system-ui)}
.nstage .bg{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transform:scale(1.04);transition:opacity 1.4s ease,transform 6s cubic-bezier(.2,.7,.2,1)}
.nstage.nin .bg{opacity:1;transform:none}
.nstage.ndark{background:#000}.nstage.ndark .bg{display:none}
.nstage canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sbar{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 4px}
.stitle .sth{font:500 1.5rem/1.1 "Frank Ruhl Libre","FRL",serif}
.stitle .sten{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#a9a3d6;margin-top:2px}
.sx{width:42px;height:42px;border-radius:50%;border:1px solid rgba(201,196,239,.28);background:rgba(255,255,255,.05);color:#d9d5f7;font-size:1.3rem;line-height:1;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sbody{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:8px 18px;text-align:center;overflow-y:auto}
.sfoot{position:relative;z-index:3;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.glass{background:rgba(14,12,38,.58);border:1px solid rgba(233,194,122,.2);border-radius:20px;backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07);padding:14px 16px}
.ghe{font-family:"Frank Ruhl Libre","FRL",serif;color:var(--sg);text-shadow:0 0 calc(10px + 18px*var(--lvl)) rgba(233,194,122,.55),0 0 42px rgba(233,194,122,.18);direction:rtl}
.gmeta{color:var(--sm);font-size:.86rem;line-height:1.45}
.gsmall{color:#a9a3d6;font-size:.76rem;letter-spacing:.04em}
.nbtn{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-height:48px;padding:12px 22px;border-radius:999px;border:1px solid rgba(233,194,122,.55);background:linear-gradient(180deg,rgba(233,194,122,.26),rgba(233,194,122,.07)),rgba(12,10,32,.6);color:#fff3d6;font:600 .98rem var(--body,system-ui);letter-spacing:.01em;box-shadow:0 0 0 0 rgba(233,194,122,0);transition:box-shadow .4s,transform .15s}
.nbtn:active{transform:scale(.97)}.nbtn.lead{box-shadow:0 0 24px 2px rgba(233,194,122,.35);border-color:var(--sg)}
.nbtn.ghost{background:rgba(12,10,32,.55);border-color:rgba(201,196,239,.3);color:#d9d5f7}
.nbtn[disabled]{opacity:.4}
.nbtn svg{width:18px;height:18px;vertical-align:-3px;margin-inline-end:6px}
.nstage .pic{background:rgba(14,12,38,.5)!important;box-shadow:0 0 18px rgba(233,194,122,.18)!important;border:1px solid rgba(233,194,122,.35)!important;color:var(--sg)!important;border-radius:50%}
.nstage .pic svg,.nstage .pic svg *{stroke:var(--sg)!important}.nstage .pic svg [fill]:not([fill="none"]){fill:rgba(233,194,122,.3)!important}
.nstage .pic svg{stroke:currentColor}
.ring{width:118px;height:118px;border-radius:50%;border:1.5px solid rgba(233,194,122,.6);display:grid;place-items:center;box-shadow:0 0 calc(10px + 60px*var(--lvl)) rgba(233,194,122,calc(.15 + .5*var(--lvl))),inset 0 0 30px rgba(233,194,122,.12);transform:scale(calc(1 + .22*var(--lvl)));transition:transform .08s linear}
.ring span{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sg)}
.ring.idle{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 34px rgba(233,194,122,.28)}}
.heard{font-size:1.8rem}
.gstep{display:flex;gap:8px;align-items:center;justify-content:center}
.gstep b{min-width:2.2em;font-size:1.3rem;color:var(--sg)}
.gstep button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(201,196,239,.35);background:rgba(255,255,255,.04);color:#e8e4ff;font-size:1.2rem}
.gtog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.gtog button{padding:8px 14px;border-radius:999px;border:1px solid rgba(201,196,239,.3);background:none;color:#cfcaf3;font-size:.85rem}.gtog button[aria-pressed=true]{border-color:var(--sg);color:var(--sg-hi);background:rgba(233,194,122,.12)}
.waves{width:100%;height:150px;display:block}
.fadein{animation:fin .8s ease both}@keyframes fin{from{opacity:0;transform:translateY(8px)}}
/* duet */
.beads{display:flex;flex-direction:row-reverse;flex-wrap:wrap;gap:10px;justify-content:center}
.bead{padding:10px 14px;border-radius:16px;border:1px solid rgba(233,194,122,.25);background:rgba(255,255,255,.04);transition:all .35s}
.bead .ghe{font-size:1.9rem;display:block;line-height:1.25}.bead .gsmall{display:block}
.bead.on{border-color:var(--sg);background:rgba(233,194,122,.16);box-shadow:0 0 26px rgba(233,194,122,.35)}
.bead.you{border-style:dashed;border-color:rgba(201,196,239,.7);box-shadow:0 0 calc(30px*var(--lvl)) rgba(201,196,239,.6)}
.bead.hide .ghe{filter:blur(7px);opacity:.5}
.horizon{width:86%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--sg),transparent);box-shadow:0 0 18px rgba(233,194,122,.7);opacity:.25;transition:opacity .4s}
.horizon.sing{opacity:1}
/* fuse */
.medal{position:relative;width:min(64vw,260px);aspect-ratio:1;display:grid;place-items:center}
.medal .pic{width:58%;height:58%;font-size:4.2rem;display:grid;place-items:center}
.medal .pic svg{width:70%;height:70%}
.medal svg.fuse{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ember{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;background:url(media/stage/ember.webp) center/contain no-repeat;transform:scale(calc(.8 + .9*var(--lvl)));filter:drop-shadow(0 0 12px rgba(255,160,60,.8));pointer-events:none}
.ember.out{filter:grayscale(1) brightness(.5);opacity:.35;transition:all 1s}
.ember.lit{transform:scale(1.8);transition:transform .5s}
.board{width:100%;max-width:360px}.board div{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid rgba(201,196,239,.12)}.board div:first-child{color:var(--sg-hi)}
/* blind pilot */
.pilot{position:absolute;inset:0;z-index:2;touch-action:none}
.pilot .side{position:absolute;top:50%;transform:translateY(-50%);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:#6d6a8a;opacity:.5}
.pilot .pl{left:16px}.pilot .pr2{right:16px}
.pulse{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border-radius:50%;border:1px solid rgba(201,196,239,.15)}
.pulse.go{animation:pl 1s ease-out}@keyframes pl{0%{transform:scale(.6);opacity:.9;border-color:rgba(233,194,122,.5)}100%{transform:scale(2.6);opacity:0}}
/* plate frame: keeps live drawing locked to the rendered scene */
.plate{position:absolute;left:50%;top:0;height:100%;aspect-ratio:9/16;transform:translateX(-50%);background:center/100% 100% no-repeat}
.plate svg.ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.over{position:relative;z-index:2}
.leaf text{font-family:"Frank Ruhl Libre","FRL",serif;fill:var(--sg);font-size:22px}
.branch{fill:none;stroke:url(#brg);stroke-linecap:round;filter:url(#glow)}
.grow{animation:grow 1.6s cubic-bezier(.2,.7,.2,1) both}@keyframes grow{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.seedl{font-family:"Frank Ruhl Libre","FRL",serif;font-size:34px;fill:#3a2508;opacity:0;transition:opacity 1s}.seedl.on{opacity:1}
.orbs{display:flex;gap:30px;justify-content:center}.orb{width:66px;height:66px;border-radius:50%;border:1px solid rgba(233,194,122,.4);display:grid;place-items:center;color:var(--sg);font-size:1.3rem;background:radial-gradient(circle at 35% 30%,rgba(255,241,207,.25),rgba(233,194,122,.05) 60%)}.orb.on{box-shadow:0 0 30px rgba(233,194,122,.6);border-color:var(--sg)}
/* body hebrew */
.figure{width:min(70vw,280px);height:min(46vh,340px)}
.figure path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.figure.dim{opacity:.25}
/* then and now */
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;max-width:340px;margin:0 auto}
.dots button{aspect-ratio:1;border-radius:50%;border:1px solid rgba(201,196,239,.28);background:rgba(255,255,255,.03);padding:0;color:transparent;font-size:.6rem}
.dots button.hasrec{background:radial-gradient(circle,var(--sg-hi),var(--sg) 45%,rgba(233,194,122,.2));border-color:var(--sg);box-shadow:0 0 10px rgba(233,194,122,.5)}
.dots button.today{outline:1px dashed var(--sg);outline-offset:3px}
/* alchemy */
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.coin{min-width:76px;height:76px;padding:0 10px;border-radius:50%;border:1px solid rgba(233,194,122,.6);background:radial-gradient(circle at 35% 30%,#4a3a1c,#1b1308 70%);box-shadow:inset 0 2px 6px rgba(255,230,170,.35),0 6px 18px rgba(0,0,0,.5);display:grid;place-items:center;transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .9s,filter .9s}
.coin b{font:500 1.35rem "Frank Ruhl Libre","FRL",serif;background:linear-gradient(180deg,#fff1cf,#e9c27a 45%,#9c6f2c);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.06em}
.coin.used{opacity:.25}
.coin.melt{transform:translate(var(--tx),var(--ty)) scale(.35);filter:blur(3px) brightness(2);opacity:0}

/* ===== rev 10 skin ===== */
html,body{background:var(--paper)}
body{padding-bottom:108px;background-image:radial-gradient(90% 40% at 100% 0%,color-mix(in srgb,var(--gold) 10%,transparent),transparent 70%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,24px 24px,24px 24px;background-attachment:fixed,scroll,scroll}
h1{font-family:var(--disp);font-size:2.05rem;font-weight:700;letter-spacing:.005em;line-height:1.05}

h3{font-size:1.03rem}

.card{border-radius:18px;padding:16px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 26px -14px rgba(var(--shadow),.35);transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}

@keyframes shine{0%,70%{left:-60%}100%{left:130%}}

/* ---------- state ---------- */
